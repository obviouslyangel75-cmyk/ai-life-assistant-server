<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CelebConnect — where the stars post</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="navbar">
  <div class="brand">CelebConnect<span class="dot">.</span></div>
  <div class="search">
    <input id="searchInput" type="text" placeholder="Search celebrities...">
  </div>
  <div class="right" id="navRight">
    <!-- filled by app.js depending on auth state -->
  </div>
</div>

<div class="layout">
  <aside class="sidebar-left card">
    <ul class="nav-list" id="navList">
      <li class="active" data-nav="feed"><span class="emoji">🏠</span> News Feed</li>
      <li data-nav="following"><span class="emoji">⭐</span> Following</li>
      <li data-nav="plans"><span class="emoji">💎</span> Subscription Plans</li>
    </ul>
    <h4>Browse by category</h4>
    <ul class="nav-list" id="categoryList"></ul>
  </aside>

  <main>
    <div id="searchResults" class="card hidden" style="margin-bottom:16px;"></div>
    <div class="feed" id="feed"></div>
    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="btn secondary pill" id="loadMoreBtn">Show more posts</button>
    </div>
  </main>

  <aside class="sidebar-right">
    <div class="card plan-widget" id="planWidget"></div>
    <div class="card">
      <h4>Suggested for you</h4>
      <div id="suggestions"></div>
    </div>
  </aside>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="/js/app.js"></script>
</body>
</html>
